[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-researcher"
version = "1.0.0"
description = "Database compression system evolving per-column encoding recipes and a molecular (DNA) storage layer."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT License" }
dependencies = [
    "zstandard>=0.25.0",
    "numpy>=2.0.0"
]
authors = [
    { name = "Shivay00001" }
]

[project.scripts]
mrsc = "pipeline:main"

[tool.setuptools]
py-modules = ["blocks", "engine", "generate_dataset", "run_research", "pipeline"]
